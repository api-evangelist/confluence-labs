aid: confluence-labs
name: Confluence Labs
description: >-
  Confluence Labs is a San Francisco AI research company (Y Combinator Winter 2026, backed by
  Paul Graham) focused on learning efficiency — building machine learning systems that learn from
  limited data and few experiments. Founded by Brent Burdick and Niranjan Baskaran, the lab works
  on hypothesis generation (using AI to design maximally informative experiments) and data-efficient
  modeling (combining large language models with discrete program search) to accelerate breakthroughs
  in data-sparse domains such as drug design, materials engineering, hardware, and physics discovery.
  The team reported state-of-the-art performance on the ARC-AGI-2 reasoning benchmark using LLM-driven
  program synthesis and open-sourced their solver on GitHub. Confluence Labs currently publishes no
  public API, developer portal, SDK, or OpenAPI surface; this profile captures verified company identity
  for the API Evangelist network.
